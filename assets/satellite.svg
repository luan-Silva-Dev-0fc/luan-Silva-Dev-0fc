<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffc3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0077aa" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="goldDish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f78c6c"/>
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Flutuação suave do satélite */
    .satellite-group {
      animation: satelliteFloat 4s ease-in-out infinite;
      transform-origin: 160px 110px;
    }

    @keyframes satelliteFloat {
      0%, 100% {
        transform: translateY(0px) rotate(-1deg);
      }
      50% {
        transform: translateY(-12px) rotate(2deg);
      }
    }

    /* Ondas de transmissão da antena */
    .signal-wave {
      animation: signalPulse 2.5s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      transform-origin: 160px 58px;
    }

    .wave-2 {
      animation-delay: 0.8s;
    }

    .wave-3 {
      animation-delay: 1.6s;
    }

    @keyframes signalPulse {
      0% {
        r: 6;
        opacity: 0.9;
        stroke-width: 2;
      }
      70% {
        opacity: 0.4;
      }
      100% {
        r: 32;
        opacity: 0;
        stroke-width: 0.5;
      }
    }

    /* Luz de status piscante */
    .beacon {
      animation: blink 1.2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #00ffc3); }
    }

    /* Estrelas com brilho suave no fundo */
    .star-twinkle-1 { animation: twinkle 3s infinite ease-in-out; }
    .star-twinkle-2 { animation: twinkle 2s infinite ease-in-out 1s; }
    .star-twinkle-3 { animation: twinkle 2.5s infinite ease-in-out 0.5s; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.85; transform: scale(1.3); }
    }
  </style>

  <!-- Fundo estelar sutil -->
  <g class="stars">
    <circle cx="45" cy="40" r="1.5" fill="#00ffc3" class="star-twinkle-1" />
    <circle cx="275" cy="35" r="1.2" fill="#ffffff" class="star-twinkle-2" />
    <circle cx="80" cy="180" r="1" fill="#ffffff" class="star-twinkle-3" />
    <circle cx="285" cy="170" r="1.8" fill="#00ffc3" class="star-twinkle-1" />
    <circle cx="30" cy="120" r="1.2" fill="#88ccff" class="star-twinkle-2" />
    <circle cx="295" cy="90" r="1" fill="#ffffff" class="star-twinkle-3" />
  </g>

  <!-- Grupo do Satélite com Animação -->
  <g class="satellite-group">
    <!-- Ondas de Sinal de Rádio emitidas pela antena -->
    <circle cx="160" cy="58" r="8" stroke="#00ffc3" fill="none" class="signal-wave" />
    <circle cx="160" cy="58" r="8" stroke="#00ffc3" fill="none" class="signal-wave wave-2" />
    <circle cx="160" cy="58" r="8" stroke="#00ffc3" fill="none" class="signal-wave wave-3" />

    <!-- Haste e Prato da Antena (Topo) -->
    <line x1="160" y1="85" x2="160" y2="58" stroke="#8b949e" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 142 66 Q 160 52 178 66" stroke="url(#goldDish)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="160" cy="58" r="3.5" fill="#00ffc3" filter="url(#cyanGlow)"/>

    <!-- Asa Solar Esquerda -->
    <!-- Braço conector -->
    <rect x="76" y="116" width="28" height="6" rx="2" fill="#4b5563" />
    <!-- Painel Solar -->
    <rect x="20" y="92" width="58" height="54" rx="4" fill="url(#panelGrad)" stroke="#00ffc3" stroke-width="1.5" opacity="0.95"/>
    <!-- Grade do painel solar -->
    <line x1="20" y1="110" x2="78" y2="110" stroke="#0b0f17" stroke-width="1" opacity="0.7"/>
    <line x1="20" y1="128" x2="78" y2="128" stroke="#0b0f17" stroke-width="1" opacity="0.7"/>
    <line x1="39" y1="92" x2="39" y2="146" stroke="#0b0f17" stroke-width="1" opacity="0.7"/>
    <line x1="59" y1="92" x2="59" y2="146" stroke="#0b0f17" stroke-width="1" opacity="0.7"/>

    <!-- Asa Solar Direita -->
    <!-- Braço conector -->
    <rect x="216" y="116" width="28" height="6" rx="2" fill="#4b5563" />
    <!-- Painel Solar -->
    <rect x="242" y="92" width="58" height="54" rx="4" fill="url(#panelGrad)" stroke="#00ffc3" stroke-width="1.5" opacity="0.95"/>
    <!-- Grade do painel solar -->
    <line x1="242" y1="110" x2="300" y2="110" stroke="#0b0f17" stroke-width="1" opacity="0.7"/>
    <line x1="242" y1="128" x2="300" y2="128" stroke="#0b0f17" stroke-width="1" opacity="0.7"/>
    <line x1="261" y1="92" x2="261" y2="146" stroke="#0b0f17" stroke-width="1" opacity="0.7"/>
    <line x1="281" y1="92" x2="281" y2="146" stroke="#0b0f17" stroke-width="1" opacity="0.7"/>

    <!-- Corpo Central do Satélite (Módulo Principal) -->
    <rect x="104" y="85" width="112" height="68" rx="8" fill="url(#bodyGrad)" stroke="#00ffc3" stroke-width="2"/>

    <!-- Detalhes do Corpo / Escudo térmico e placas -->
    <rect x="114" y="95" width="92" height="48" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    
    <!-- Linhas de circuito internas -->
    <path d="M 120 119 L 140 119 L 148 111 L 172 111 L 180 119 L 200 119" stroke="#00ffc3" stroke-width="1.5" fill="none" opacity="0.6"/>
    <circle cx="148" cy="111" r="2" fill="#00ffc3" />
    <circle cx="172" cy="111" r="2" fill="#00ffc3" />

    <!-- Lentes de sensores e LEDs de telemetria -->
    <circle cx="130" cy="103" r="3" fill="#00ffc3" class="beacon" />
    <circle cx="140" cy="103" r="2" fill="#58a6ff" />
    <circle cx="180" cy="103" r="2" fill="#ffd166" />
    <circle cx="190" cy="103" r="3" fill="#ff5555" class="beacon" style="animation-delay: 0.6s;" />

    <!-- Thruster / Propulsor inferior -->
    <path d="M 150 153 L 170 153 L 166 163 L 154 163 Z" fill="#374151" stroke="#4b5563" stroke-width="1"/>
    <!-- Brilho de propulsão de íons sutil -->
    <ellipse cx="160" cy="166" rx="5" ry="3" fill="#00ffc3" opacity="0.7" filter="url(#cyanGlow)" class="beacon"/>
  </g>
</svg>
